<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder AI | Find your next move</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{% url 'core:home' %}"><span>PA</span> Pathfinder</a>
      <nav aria-label="Primary navigation">
        {% if user.is_authenticated %}
          <span class="nav-user">Signed in as <strong>{{ user.username }}</strong></span>
          <a href="{% url 'core:profile-preferences' %}">Preferences</a>
          <a href="{% url 'accounts:logout' %}">Log out</a>
        {% else %}
          <a href="{% url 'accounts:register' %}">Register</a>
          <a class="nav-cta" href="{% url 'accounts:login' %}">Log in</a>
        {% endif %}
      </nav>
    </header>

    <div class="site-shell">
      {% block header %}{% endblock header %}
      {% block content %}{% endblock content %}
    </div>
</body>
</html>
