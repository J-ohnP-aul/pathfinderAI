{% extends 'base.html' %}

{% block content %}
<main class="preferences-page">
  <h1>Your preferences</h1>
  <p>Tell Pathfinder what makes a good outing for you.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="form-group">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit">Save preferences</button>
  </form>
</main>
{% endblock %}
